<svg xmlns="http://www.w3.org/2000/svg" class="circuit-svg" viewBox="0 0 1040 500" role="img" aria-labelledby="circuit-title circuit-desc">
<style type="text/css"><![CDATA[
.circuit-svg .svg-background{fill:#101b2c;stroke:#253c5a;stroke-width:1}
.circuit-svg text{font-family:monospace;text-anchor:middle;fill:#dce7f6;font-size:10px}
.circuit-svg .svg-label{text-anchor:start;font-size:9px;letter-spacing:1.3px;fill:#91a2bd}
.circuit-svg .svg-small{text-anchor:start;font-size:8px;fill:#91a2bd}
.circuit-svg .mode-text{fill:#b69cff}
.circuit-svg .wire-label{text-anchor:start;font-size:9px;fill:#a9bad3}
.circuit-svg .mode-label{fill:#b69cff}
.circuit-svg .xor-box{fill:#152d4b;stroke:#62b9ff;stroke-width:1.1}
.circuit-svg .fa-box{fill:#132b3c;stroke:#55d6a5;stroke-width:1.1}
.circuit-svg .fa-title{font-size:10px;fill:#e4f5f0}
.circuit-svg .fa-sub{font-size:8px;fill:#9ab9b3}
.circuit-svg .sum-box{fill:#142d3b;stroke:#55d6a5;stroke-width:1.1}
.circuit-svg .wire{fill:none;stroke-width:1.4}
.circuit-svg .data-wire{stroke:#62b9ff}
.circuit-svg .mode-wire{stroke:#b69cff;stroke-dasharray:4 4}
.circuit-svg .carry-wire{stroke:#55d6a5}
.circuit-svg .carry-port{font-size:8px;fill:#55d6a5;text-anchor:start}
.circuit-svg .chain-node{fill:#132b3c;stroke:#55d6a5;stroke-width:1}
.circuit-svg .chain-text{font-size:8px;fill:#d7f3e9}
.circuit-svg .svg-footnote{text-anchor:start;font-family:sans-serif;font-size:9px;fill:#7d90ac}
]]></style>
            <title id="circuit-title">Four-bit adder-subtractor circuit block diagram</title>
            <desc id="circuit-desc">Each B bit is XORed with the common mode input M and paired with the corresponding A bit in a full adder. The mode also sets initial carry C0. A separate ripple-carry path shows the carry sequence between the four full-adder stages.</desc>
            <defs>
              <marker id="arrowData" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#62b9ff" stroke-width="1.2"/></marker>
              <marker id="arrowMode" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b69cff" stroke-width="1.2"/></marker>
              <marker id="arrowCarry" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#55d6a5" stroke-width="1.2"/></marker>
            </defs>
            <rect class="svg-background" x="0" y="0" width="1040" height="500" rx="12"/>
            <text x="26" y="30" class="svg-label">MODE-CONTROLLED 4-BIT ADDER–SUBTRACTOR</text>
            <text x="22" y="59" class="svg-label mode-text">MODE M</text>
            <path class="wire mode-wire" d="M55 65 V414"/>
            <text x="105" y="59" class="svg-small">COMMON CONTROL INPUT</text>
            <g class="bit-row">
      <text class="wire-label" x="105" y="91">B0</text>
      <path class="wire data-wire" d="M130 91 H250"/>
      <path class="wire mode-wire" d="M55 111 H250"/>
      <text class="wire-label mode-label" x="104" y="114">M</text>
      <rect class="xor-box" x="250" y="78" width="112" height="45" rx="8"/>
      <text x="306" y="105">XOR0</text>
      <path class="wire data-wire" d="M362 100 H510" marker-end="url(#arrowData)"/>
      <text class="wire-label" x="105" y="139">A0</text>
      <path class="wire data-wire" d="M130 126 H510" marker-end="url(#arrowData)"/>
      <rect class="fa-box" x="510" y="78" width="170" height="55" rx="9"/>
      <text x="595" y="101" class="fa-title">FULL ADDER 0</text>
      <text x="595" y="118" class="fa-sub">A0, X0, C0</text>
      <path class="wire data-wire" d="M680 117 H790" marker-end="url(#arrowData)"/>
      <rect class="sum-box" x="790" y="95" width="93" height="39" rx="7"/>
      <text x="836" y="120">S0</text>
      <text class="carry-port" x="685" y="90">C1</text>
    </g><g class="bit-row">
      <text class="wire-label" x="105" y="181">B1</text>
      <path class="wire data-wire" d="M130 181 H250"/>
      <path class="wire mode-wire" d="M55 201 H250"/>
      <text class="wire-label mode-label" x="104" y="204">M</text>
      <rect class="xor-box" x="250" y="168" width="112" height="45" rx="8"/>
      <text x="306" y="195">XOR1</text>
      <path class="wire data-wire" d="M362 190 H510" marker-end="url(#arrowData)"/>
      <text class="wire-label" x="105" y="229">A1</text>
      <path class="wire data-wire" d="M130 216 H510" marker-end="url(#arrowData)"/>
      <rect class="fa-box" x="510" y="168" width="170" height="55" rx="9"/>
      <text x="595" y="191" class="fa-title">FULL ADDER 1</text>
      <text x="595" y="208" class="fa-sub">A1, X1, C1</text>
      <path class="wire data-wire" d="M680 207 H790" marker-end="url(#arrowData)"/>
      <rect class="sum-box" x="790" y="185" width="93" height="39" rx="7"/>
      <text x="836" y="210">S1</text>
      <text class="carry-port" x="685" y="180">C2</text>
    </g><g class="bit-row">
      <text class="wire-label" x="105" y="271">B2</text>
      <path class="wire data-wire" d="M130 271 H250"/>
      <path class="wire mode-wire" d="M55 291 H250"/>
      <text class="wire-label mode-label" x="104" y="294">M</text>
      <rect class="xor-box" x="250" y="258" width="112" height="45" rx="8"/>
      <text x="306" y="285">XOR2</text>
      <path class="wire data-wire" d="M362 280 H510" marker-end="url(#arrowData)"/>
      <text class="wire-label" x="105" y="319">A2</text>
      <path class="wire data-wire" d="M130 306 H510" marker-end="url(#arrowData)"/>
      <rect class="fa-box" x="510" y="258" width="170" height="55" rx="9"/>
      <text x="595" y="281" class="fa-title">FULL ADDER 2</text>
      <text x="595" y="298" class="fa-sub">A2, X2, C2</text>
      <path class="wire data-wire" d="M680 297 H790" marker-end="url(#arrowData)"/>
      <rect class="sum-box" x="790" y="275" width="93" height="39" rx="7"/>
      <text x="836" y="300">S2</text>
      <text class="carry-port" x="685" y="270">C3</text>
    </g><g class="bit-row">
      <text class="wire-label" x="105" y="361">B3</text>
      <path class="wire data-wire" d="M130 361 H250"/>
      <path class="wire mode-wire" d="M55 381 H250"/>
      <text class="wire-label mode-label" x="104" y="384">M</text>
      <rect class="xor-box" x="250" y="348" width="112" height="45" rx="8"/>
      <text x="306" y="375">XOR3</text>
      <path class="wire data-wire" d="M362 370 H510" marker-end="url(#arrowData)"/>
      <text class="wire-label" x="105" y="409">A3</text>
      <path class="wire data-wire" d="M130 396 H510" marker-end="url(#arrowData)"/>
      <rect class="fa-box" x="510" y="348" width="170" height="55" rx="9"/>
      <text x="595" y="371" class="fa-title">FULL ADDER 3</text>
      <text x="595" y="388" class="fa-sub">A3, X3, C3</text>
      <path class="wire data-wire" d="M680 387 H790" marker-end="url(#arrowData)"/>
      <rect class="sum-box" x="790" y="365" width="93" height="39" rx="7"/>
      <text x="836" y="390">S3</text>
      <text class="carry-port" x="685" y="360">C4</text>
    </g><text x="34" y="430" class="svg-label">RIPPLE-CARRY PATH</text><rect class="chain-node" x="72" y="444" width="78" height="30" rx="6"/><text class="chain-text" x="111.0" y="463">C0 = M</text><rect class="chain-node" x="174" y="444" width="60" height="30" rx="6"/><text class="chain-text" x="204.0" y="463">FA0</text><rect class="chain-node" x="258" y="444" width="43" height="30" rx="6"/><text class="chain-text" x="279.5" y="463">C1</text><rect class="chain-node" x="322" y="444" width="60" height="30" rx="6"/><text class="chain-text" x="352.0" y="463">FA1</text><rect class="chain-node" x="406" y="444" width="43" height="30" rx="6"/><text class="chain-text" x="427.5" y="463">C2</text><rect class="chain-node" x="470" y="444" width="60" height="30" rx="6"/><text class="chain-text" x="500.0" y="463">FA2</text><rect class="chain-node" x="554" y="444" width="43" height="30" rx="6"/><text class="chain-text" x="575.5" y="463">C3</text><rect class="chain-node" x="618" y="444" width="60" height="30" rx="6"/><text class="chain-text" x="648.0" y="463">FA3</text><rect class="chain-node" x="700" y="444" width="90" height="30" rx="6"/><text class="chain-text" x="745.0" y="463">C4 = Cout</text><path class="wire carry-wire" d="M153 459 H169" marker-end="url(#arrowCarry)"/><path class="wire carry-wire" d="M237 459 H253" marker-end="url(#arrowCarry)"/><path class="wire carry-wire" d="M304 459 H317" marker-end="url(#arrowCarry)"/><path class="wire carry-wire" d="M385 459 H401" marker-end="url(#arrowCarry)"/><path class="wire carry-wire" d="M452 459 H465" marker-end="url(#arrowCarry)"/><path class="wire carry-wire" d="M533 459 H549" marker-end="url(#arrowCarry)"/><path class="wire carry-wire" d="M600 459 H613" marker-end="url(#arrowCarry)"/><path class="wire carry-wire" d="M681 459 H695" marker-end="url(#arrowCarry)"/>
            <text x="34" y="490" class="svg-footnote">FA0 handles bit 0 (LSB) first. The carry-out from each stage becomes the next stage's carry-in.</text>
          </svg>